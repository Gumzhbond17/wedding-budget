# One origin for the whole app: the built Nuxt SPA at /, Laravel behind /api, /sanctum and /up.
# Same origin means the Sanctum session cookie is first-party with no CORS or cookie-domain
# setup. Laravel's public files are never served from here: every PHP request goes to
# public/index.php, and receipts stay on a volume this container cannot even see.

# TLS ends at a reverse proxy or load balancer in front of this container. It must overwrite
# X-Forwarded-Proto; Laravel then sees HTTPS (secure cookies, https signed URLs) and HSTS is sent.
map $http_x_forwarded_proto $forwarded_https {
    https   on;
    default "";
}

map $http_x_forwarded_proto $hsts {
    https   "max-age=31536000; includeSubDomains";
    # Empty: nginx omits the header. HSTS over plain HTTP is ignored by browsers anyway.
    default "";
}

# Laravel sets its own Referrer-Policy / nosniff on some responses (no-referrer on receipts):
# keep those, add ours only where the upstream sent none, so a response never has two.
map $upstream_http_referrer_policy $referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}

map $upstream_http_x_content_type_options $content_type_options {
    ""      "nosniff";
    default "";
}

# Paths only, never query strings: signed receipt URLs carry their signature in the query.
log_format path_only '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent" $request_time';

server {
    # nginx-unprivileged listens on 8080 as a non-root user.
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;
    access_log /var/log/nginx/access.log path_only;

    # Receipts are at most 5 MB (validated by Laravel); a little headroom for the multipart body.
    client_max_body_size 6m;

    root /usr/share/nginx/html;

    include /etc/nginx/snippets/security-headers.conf;

    location ^~ /api/ {
        include /etc/nginx/snippets/laravel.conf;
    }

    # Signed receipt downloads: not even the path is worth logging.
    location ^~ /api/v1/receipts/ {
        access_log off;
        include /etc/nginx/snippets/laravel.conf;
    }

    location ^~ /sanctum/ {
        include /etc/nginx/snippets/laravel.conf;
    }

    # Laravel's health route: checks that PHP boots, used by the container healthcheck.
    location = /up {
        access_log off;
        include /etc/nginx/snippets/laravel.conf;
    }

    # Hashed build assets never change under the same name.
    location ^~ /_nuxt/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The SPA: real files first, then the client-side router's shell (200.html from nuxt generate).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html /200.html;
    }

    # Dotfiles (.env, .git) never exist here, but refuse them outright.
    location ~ /\. {
        deny all;
    }
}
