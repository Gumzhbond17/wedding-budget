# Every Laravel request goes to public/index.php in the app container (php-fpm on port 9000).
# The path is the app container's; this container holds no PHP files.
fastcgi_pass app:9000;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/html/public;
fastcgi_param HTTPS $forwarded_https if_not_empty;
# Blocks the "httpoxy" attack: a client Proxy header must never become HTTP_PROXY.
fastcgi_param HTTP_PROXY "";

fastcgi_hide_header X-Powered-By;
fastcgi_read_timeout 60s;
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
