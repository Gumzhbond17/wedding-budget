# Included at server level and again in every location that adds its own header: nginx drops
# inherited add_header directives as soon as a location declares one.
add_header Strict-Transport-Security $hsts always;
add_header X-Content-Type-Options $content_type_options always;
add_header Referrer-Policy $referrer_policy always;
# Never framed (clickjacking). X-Frame-Options for browsers without CSP frame-ancestors.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
