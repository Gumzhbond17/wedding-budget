; php-fpm pool overrides, loaded after the image's www.conf and zz-docker.conf.
[www]
listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Answered by php-fpm itself (no PHP code), for the container healthcheck via cgi-fcgi.
ping.path = /fpm-ping
ping.response = pong

; Request lines include query strings (signed receipt URLs): no php-fpm access log.
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
