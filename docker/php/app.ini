; Production settings on top of php.ini-production.

expose_php = Off
memory_limit = 256M
date.timezone = UTC

; Receipts are at most 5 MB (validated by Laravel); headroom for the multipart body.
upload_max_filesize = 6M
post_max_size = 8M

; OPcache: code is baked into the image and never changes in a running container, so files
; are never re-checked (validate_timestamps=0). A new release is a new container.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

realpath_cache_size = 4096K
realpath_cache_ttl = 600
