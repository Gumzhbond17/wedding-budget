name: Backend tests

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check code style
        run: vendor/bin/pint --test

  pest:
    name: Pest (PHP 8.5, MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # MySQL, not SQLite: the suite relies on CHECK constraints, FK cascade/RESTRICT errors
    # (1451) and DECIMAL behaviour that SQLite does not reproduce.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wedding-budget-testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Real environment variables win over .env, and phpunit.xml forces DB_CONNECTION and
    # DB_DATABASE, so only the connection details are set here. Root may create the
    # per-process databases that --parallel needs.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, intl, mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.5-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run tests
        run: vendor/bin/pest --parallel
